<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Campos Dora Graciela</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #52b788 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-section {
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        h1 {
            color: #1b4332;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #555;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
            position: relative;
        }

        label {
            display: block;
            color: #2d6a4f;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1.1rem;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            color: #333;
            background-color: #f9f9f9;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #52b788;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
        }

        .error-message {
            background-color: #ffe3e3;
            color: #d90429;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #d90429;
            text-align: left;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #2d6a4f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(45, 106, 79, 0.2);
        }

        .btn-login:hover {
            background-color: #1b4332;
            box-shadow: 0 6px 15px rgba(27, 67, 50, 0.3);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #777;
        }

        .footer-text strong {
            color: #2d6a4f;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <span class="logo-icon">🌱</span>
            <h1>CAMPOS DORA GRACIELA</h1>
            <p class="subtitle">Control de Espárragos</p>
        </div>

        <div id="mensajeError" class="error-message">
            ⚠️ Usuario o contraseña incorrectos. Por favor, intente de nuevo.
        </div>

        <form id="loginForm" onsubmit="validarLogin(event)">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <div class="input-wrapper">
                    <span>👤</span>
                    <input type="text" id="usuario" placeholder="Ingrese su usuario" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <span>🔒</span>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>

        <p class="footer-text">Desarrollado por: <strong>William Guiomar Andia De La Cruz</strong></p>
    </div>

    <script>
        // Si ya hay una sesión activa que no ha expirado, redirigir automáticamente
        let sesionActiva = localStorage.getItem("sesionActiva");
        let horaLogin = localStorage.getItem("horaLogin");
        let tiempoActual = Date.now();
        let tiempoLimite = 600000; // 10 minutos

        if (sesionActiva === "true" && horaLogin && (tiempoActual - horaLogin < tiempoLimite)) {
            window.location.href = "index.html";
        }

        function validarLogin(event) {
            event.preventDefault();

            let user = document.getElementById("usuario").value.trim();
            let pass = document.getElementById("password").value;
            let errorDiv = document.getElementById("mensajeError");

            // AJUSTA AQUÍ TU USUARIO Y CONTRASEÑA ACTUALES
            if (user === "admin" && pass === "1234") {
                localStorage.setItem("sesionActiva", "true");
                localStorage.setItem("horaLogin", Date.now());
                window.location.href = "index.html";
            } else {
                errorDiv.style.display = "block";
                document.getElementById("password").value = "";
                document.getElementById("password").focus();
            }
        }
    </script>
</body>
</html>
