<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Espárragos - Ingreso</title>
    <link rel="stylesheet" href="estilos-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icono">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <h1>Campos Dora Graciela</h1>
                <p>Sistema de Control de Espárragos</p>
            </div>

            <div class="login-body">
                <div class="grupo-input-login">
                    <label for="usuario"><i class="fa-solid fa-user"></i> Usuario</label>
                    <div class="input-contenedor">
                        <input type="text" id="usuario" placeholder="Ingrese su usuario" autocomplete="off">
                    </div>
                </div>

                <div class="grupo-input-login">
                    <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
                    <div class="input-contenedor">
                        <input type="password" id="password" placeholder="••••••••">
                    </div>
                </div>

                <p id="mensajeError" class="mensaje-error"></p>

                <button class="btn-login" onclick="iniciarSesion()">
                    Ingresar al Sistema <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
            <div class="login-footer">
                <p>&copy; 2026 | Desarrollado por William Andia</p>
            </div>
        </div>
    </div>

    <script src="script-login.js"></script>
</body>
</html>
