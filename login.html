<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Espárragos - Ingreso</title>
    <link rel="stylesheet" href="estilos-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="particulas-container">
        <div class="particula"></div>
        <div class="particula"></div>
        <div class="particula"></div>
        <div class="particula"></div>
        <div class="particula"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <div class="logo-icono animacion-flotante">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <h1 id="saludo">Bienvenido</h1>
                <h2>Campos Dora Graciela</h2>
                <p>Sistema de Control de Espárragos</p>
            </div>

            <div class="login-body">
                
                <div class="grupo-input-login">
                    <div class="input-contenedor">
                        <input type="text" id="usuario" placeholder=" " autocomplete="off">
                        <label for="usuario"><i class="fa-solid fa-user"></i> Usuario</label>
                    </div>
                </div>

                <div class="grupo-input-login">
                    <div class="input-contenedor">
                        <input type="password" id="password" placeholder=" ">
                        <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
                        <i class="fa-solid fa-eye icono-ojo" id="togglePassword" onclick="alternarContrasena()"></i>
                    </div>
                </div>

                <p id="mensajeError" class="mensaje-error"></p>

                <button class="btn-login" id="btnIngresar" onclick="iniciarSesion()">
                    <span id="btnTexto">Ingresar al Sistema <i class="fa-solid fa-arrow-right"></i></span>
                    <i class="fa-solid fa-circle-notch fa-spin oculto" id="btnSpinner"></i>
                </button>
            </div>
            
        </div>
        
        <div class="login-footer">
            <p>&copy; 2026 | Desarrollado por William Andia</p>
        </div>
    </div>

    <script src="script-login.js"></script>
</body>
</html>
