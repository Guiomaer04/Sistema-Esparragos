<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Espárragos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="login-body">

    <div class="login-box">
        <h1>🌱 Iniciar Sesión</h1>
        <p class="login-subtitulo">Sistema de Control de Espárragos</p>

        <input type="text" id="usuario" placeholder="Ingrese usuario" class="login-input">

        <div class="wrapper-clave">
            <input type="password" id="clave" placeholder="Ingrese contraseña" class="login-input">
            <button type="button" onclick="mostrarClave()" class="btn-ojo">👁️</button>
        </div>

        <button onclick="iniciarSesion()" class="btn-login">Ingresar</button>

        <p id="mensajeError"></p>
    </div>

    <script>
        function iniciarSesion(){
            let usuario = document.getElementById("usuario").value.trim();
            let clave = document.getElementById("clave").value;

            if(usuario === "Guiomar12" && clave === "G24T12D01j09."){
                localStorage.setItem("sesionActiva", "true");
                localStorage.setItem("horaLogin", Date.now());
                window.location.href = "index.html";
            }else{
                document.getElementById("mensajeError").textContent = "Usuario o contraseña incorrectos";
            }
        }

        function mostrarClave(){
            let input = document.getElementById("clave");
            input.type = (input.type === "password") ? "text" : "password";
        }
    </script>

</body>
</html>
